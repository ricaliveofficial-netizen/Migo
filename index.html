<!DOCTYPE html>
<html>
<head>
    <title>Voice Rooms</title>
    <style>
        body { font-family: Arial; background:#f7f7f7; padding:30px; text-align:center; }
        .box{
            width:320px; margin:auto; background:white; padding:25px;
            border-radius:12px; box-shadow:0 0 10px #ccc;
        }
        input, button{
            width:100%; padding:12px; font-size:16px; border-radius:8px;
            border:1px solid #888; margin-top:10px;
        }
        button{ background:#4CAF50; color:white; border:none; cursor:pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>Enter Room</h2>

    <input id="room" placeholder="Room Name" value="testroom">

    <button onclick="goRoom()">Join Room</button>
</div>

<script>
function goRoom(){
    let r = document.getElementById("room").value;
    window.location.href = "room.html?room=" + r;
}
</script>

</body>
</html>
