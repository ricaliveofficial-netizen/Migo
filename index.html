<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Migo Style Live Room</title>
<style>
    body {
        margin: 0;
        font-family: sans-serif;
        background: linear-gradient(#5a1dd9, #b14df1);
        color: white;
    }
    .header {
        display: flex;
        align-items: center;
        padding: 15px;
        font-size: 22px;
        font-weight: bold;
    }
    .join-box {
        margin: 40px auto;
        width: 300px;
        background: rgba(255,255,255,0.15);
        padding: 20px;
        border-radius: 16px;
        text-align: center;
    }
    input, button {
        width: 90%;
        padding: 10px;
        border-radius: 10px;
        border: none;
        margin-top: 12px;
    }
    button {
        background: #4caf50;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
</style>
</head>
<body>

<div class="header">
    🎤 Migo Live Room
</div>

<div class="join-box">
    <h3>Join Voice Room</h3>
    <input id="uid" placeholder="Enter User ID">
    <input id="room" placeholder="Enter Room Name (Use: App)">
    <button onclick="joinRoom()">Join</button>
</div>

<script>
function joinRoom() {
  const uid = document.getElementById("uid").value;
  const room = document.getElementById("room").value;

  if (!uid || !room) {
    alert("Please enter User ID & Room Name");
    return;
  }

  window.location.href = `room.html?uid=${uid}&room=${room}`;
}
</script>

</body>
</html>
