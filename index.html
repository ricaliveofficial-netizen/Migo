<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Join Voice Room</title>
  <style>
    body {
      background: #0d0d0d;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      width: 250px;
      border-radius: 6px;
    }
    button {
      background: #4caf50;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Voice Room Join</h2>

<input id="uid" placeholder="Enter User ID">
<input id="room" placeholder="Enter Room Name">

<button onclick="joinRoom()">Join</button>

<script>
function joinRoom() {
  const uid = document.getElementById("uid").value;
  const room = document.getElementById("room").value;

  if (!uid || !room) {
    alert("Please enter User ID & Room name");
    return;
  }

  window.location.href = `room.html?uid=${uid}&room=${room}`;
}
</script>

</body>
</html>
