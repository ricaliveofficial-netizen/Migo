<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Room</title>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
  <style>
    body {
      background: #0a0a0a;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 60px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      margin: 20px;
      border-radius: 8px;
      border: none;
      background: #f44336;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Voice Room Active</h2>
<p id="info"></p>

<button onclick="leave()">Leave Room</button>

<script>
// YOUR AGORA CONFIG
const APP_ID = "4adcf999c7734666ae4041af8aa1ee20";

const TOKEN = "007eJxTYJHqi7tRJL571J3j/roVrekZ28rTfYOFJbeY5bchDPdVd2j4FZGBkZGxiamtkaWJqYmyWZGxomWJiZGBoZmRrZGBoaWqbmaCSlpKWp6QAAaXMFhQ==";
// Token channel = App

// URL Params
const url = new URL(window.location.href);
const UID = url.searchParams.get("uid");
const CHANNEL = url.searchParams.get("room");

document.getElementById("info").innerHTML =
  `Joining Room: <b>${CHANNEL}</b> as User <b>${UID}</b>`;

// Agora Client
const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

async function joinRoom() {
  try {
    await client.join(APP_ID, CHANNEL, TOKEN, UID);

    const localAudio = await AgoraRTC.createMicrophoneAudioTrack();
    await client.publish(localAudio);

    console.log("Joined voice room successfully!");
  } catch (err) {
    alert("Join failed: " + err.message);
    console.error(err);
  }
}

joinRoom();

function leave() {
  client.leave();
  alert("You left the room");
  window.location.href = "index.html";
}
</script>

</body>
</html>
