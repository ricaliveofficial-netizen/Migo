<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Voice Room</title>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

    <style>
        body { font-family: Arial; background:#eef2f5; padding:20px; text-align:center; }
        .box{
            margin:auto; background:white; width:350px; padding:25px;
            border-radius:12px; box-shadow:0 0 10px #ccc;
        }
        button{
            width:100%; padding:12px; background:#FF5252;
            border:none; border-radius:8px; color:white;
            font-size:16px; margin-top:15px; cursor:pointer;
        }
    </style>
</head>

<body>

<div class="box">
    <h2 id="title">Joining...</h2>
    <p id="status">Please wait...</p>
    <button onclick="leaveRoom()">Leave Room</button>
</div>

<script>
    const APP_ID = "4adcf999c7734666ae4041af8aa1ee20";
    const TOKEN = "007eJxTYHjlq7tRJL571j3/roVreKZ82rfTYOFJbeY5boK7LmXucolQYDBJTElOs7S0TDY3NzYxMzNLTDUxMDFMTLNITDRMTTUyyP8kltkQyMjwMCGOlZEBAkF8ZgbHggIGBgBHzh9F";

    const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

    async function joinRoom(){
        const params = new URLSearchParams(window.location.search);
        const room = params.get("room");

        document.getElementById("title").innerText = "Room: " + room;

        try {
            await client.join(APP_ID, room, TOKEN, null);

            const mic = await AgoraRTC.createMicrophoneAudioTrack();
            await client.publish(mic);

            document.getElementById("status").innerText = "🎤 Connected — You Can Talk Now";
        } catch (e) {
            document.getElementById("status").innerText = "❌ Error: " + e.message;
        }
    }

    function leaveRoom(){
        client.leave();
        window.location.href = "index.html";
    }

    joinRoom();
</script>

</body>
</html>
