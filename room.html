<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Room</title>

  <script src="https://cdn.zegocloud.com/zego-express-video-call/zego-express-video-call-web.umd.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #eef1f5;
      padding: 20px;
      text-align: center;
    }
    .box {
      margin-top: 40px;
      background: white;
      padding: 25px;
      width: 360px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    button {
      padding: 12px 25px;
      background: #ff4d4d;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h2 id="roomTitle">Joining…</h2>
  <div class="box">
    <p id="status">Connecting to room...</p>
    <button onclick="leaveRoom()">Leave Room</button>
  </div>

<script>
const appID = 436671143;
const appSign = "7d2bd0f580082ef3137d43bc1fe0e0db";

const urlParams = new URLSearchParams(window.location.search);
const roomID = urlParams.get("room") || "testroom";
const userID = "user_" + Math.floor(Math.random() * 9999);

document.getElementById("roomTitle").innerText = "Room: " + roomID;

const zg = new ZegoExpressEngine(appID, appSign);

async function joinRoom() {
  try {
    await zg.loginRoom(roomID, { userID, userName: userID }, { token: null });
    document.getElementById("status").innerText = "Microphone Connected ✔";

    zg.startPublishingStream("local_audio", zg.createStream({ audio: true }));
    zg.startPlayingStream("local_audio");

  } catch (e) {
    document.getElementById("status").innerText = "Join Error: " + e.message;
  }
}

function leaveRoom() {
  zg.logoutRoom(roomID);
  window.location.href = "index.html";
}

joinRoom();
</script>

</body>
</html>
